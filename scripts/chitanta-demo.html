<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
      }
      body {
        width: 520px;
        font-family: DejaVu Sans, Arial, Helvetica, sans-serif;
        color: #111;
      }
      .sheet {
        padding: 36px 40px 40px;
      }
      h1 {
        margin: 0;
        font-size: 34px;
        letter-spacing: 0.12em;
        text-align: center;
      }
      .sub {
        margin: 8px 0 0;
        text-align: center;
        font-size: 18px;
      }
      .meta {
        margin-top: 22px;
        font-size: 20px;
        line-height: 1.5;
      }
      hr {
        border: none;
        border-top: 2px dashed #222;
        margin: 20px 0;
      }
      .row {
        display: flex;
        justify-content: space-between;
        font-size: 20px;
        margin: 8px 0;
      }
      .total {
        font-size: 26px;
        font-weight: 700;
      }
      .note {
        margin-top: 28px;
        font-size: 14px;
        color: #333;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <h1>CHITANTA</h1>
      <p class="sub">Magazin Demo Fiscally</p>
      <div class="meta">
        Str. Exemplu 1, Bucuresti<br />
        Data: 12.03.2026
      </div>
      <hr />
      <div class="row"><span>Caiet note</span><span>24,50</span></div>
      <div class="row"><span>Pix albastru</span><span>8,00</span></div>
      <hr />
      <div class="row total"><span>TOTAL</span><span>32,50 LEI</span></div>
      <p class="note">Document sintetic de test. Fara date personale.</p>
    </div>
  </body>
</html>
